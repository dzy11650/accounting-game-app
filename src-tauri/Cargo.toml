[package]
name = "accounting-game"
version = "1.0.0"
description = "会计小当家 - 会计入门游戏化教学"
authors = ["you"]
edition = "2021"

# 注意：Tauri 2.x 需要把 binary 名设置成和包名一致或自定义
[[bin]]
name = "会计小当家"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
