name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Vite build
        run: npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: googleapis

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug
        env:
          ORG_GRADLE_PROJECT_androidInjectSigningStoreFile: /tmp/debug.keystore
          ORG_GRADLE_PROJECT_androidInjectSigningStorePassword: android
          ORG_GRADLE_PROJECT_androidInjectSigningKeyAlias: androiddebugkey
          ORG_GRADLE_PROJECT_androidInjectSigningKeyPassword: android

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk app-release-2.0.4.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-game-apk
          path: app-release-2.0.4.apk
          retention-days: 30

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-game-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
