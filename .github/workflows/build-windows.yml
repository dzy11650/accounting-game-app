name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-win-portable:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      # Keep Windows signing disabled without putting the value into workflow env.
      # electron-builder reads this in the PowerShell process; previous literal
      # env entry caused `Cannot find module 'D:\...\false'`.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Vite build
        run: npm run build

      - name: Build portable exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ELECTRON_ENABLE_LOGS = "true"
          $env:DEBUG = "electron-builder:*"
          npx electron-builder --win portable --config.win.sign=false --config.win.verifyUpdateCodeSignature=false --config.win.cscAllowImplicitTargets=false 2>&1 | Tee-Object -Variable buildLog
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##vso[task setvariable variable=BUILD_FAILED]true"
            exit 1
          }
          Write-Host "=== BUILD LOG (tail) ==="
          $buildLog | Select-Object -Last 50 | ForEach-Object { Write-Host $_ }

      - name: List release artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse .\release | Select-Object FullName, Length

      - name: Zip win-unpacked for debugging
        if: always()
        shell: pwsh
        run: Compress-Archive -Path .\release\win-unpacked -DestinationPath .\release\win-unpacked-debug.zip -ErrorAction SilentlyContinue

      - name: Upload portable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-game-portable
          path: release/*.exe
          retention-days: 30

      - name: Upload debug zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-game-debug-zip
          path: release/win-unpacked-debug.zip
          retention-days: 7
