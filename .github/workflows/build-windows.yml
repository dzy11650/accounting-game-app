name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-win-portable:
    runs-on: windows-latest
    env:
      DEBUG: electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vite build
        run: npm run build
      - name: Build portable exe
        run: npx electron-builder --win portable
      - name: List release artifacts
        run: Get-ChildItem -Recurse .\release | Select-Object FullName, Length
      - name: Zip win-unpacked for debugging
        if: always()
        run: Compress-Archive -Path .\release\win-unpacked -DestinationPath .\release\win-unpacked-debug.zip
      - name: Upload portable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-game-portable
          path: release/*.exe
          retention-days: 30
      - name: Upload debug zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-game-debug-zip
          path: release/win-unpacked-debug.zip
          retention-days: 7